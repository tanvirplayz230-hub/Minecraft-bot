name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate project files
        run: |
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/AndroidManifest.xml
          python3 -m json.tool config/app-config.json >/dev/null
          chmod +x gradlew

      - name: Clean, test, and build debug APK
        shell: bash
        run: |
          mkdir -p build-logs
          set -o pipefail
          ./gradlew --no-daemon clean 2>&1 | tee build-logs/clean.log
          ./gradlew --no-daemon test 2>&1 | tee build-logs/test.log
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build-logs/debug-build.log

      - name: Validate debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK" ]]; then
            echo "ERROR: Debug APK was not generated at $APK" >&2
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Debug APK exists but is empty: $APK" >&2
            exit 1
          fi
          echo "Validated debug APK: $APK ($(stat -c%s "$APK") bytes)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBotHost-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        id: release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build-logs
          set -o pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
            ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            ANDROID_KEY_ALIAS="$KEY_ALIAS" \
            ANDROID_KEY_PASSWORD="$KEY_PASSWORD" \
              ./gradlew --no-daemon assembleRelease 2>&1 | tee build-logs/release-build.log
            echo "artifact_name=MinecraftBotHost-Release-APK" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "No complete signing credentials found; building an unsigned release APK. Android will not install this unsigned APK until it is signed."
            ./gradlew --no-daemon assembleRelease 2>&1 | tee build-logs/release-build.log
            echo "artifact_name=MinecraftBotHost-Release-APK-Unsigned" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release APK
        if: steps.release.outcome == 'success'
        shell: bash
        env:
          RELEASE_APK: ${{ steps.release.outputs.apk_path }}
        run: |
          if [[ ! -f "$RELEASE_APK" ]]; then
            echo "ERROR: Release APK was not generated at $RELEASE_APK" >&2
            find app/build/outputs/apk/release -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          if [[ ! -s "$RELEASE_APK" ]]; then
            echo "ERROR: Release APK exists but is empty: $RELEASE_APK" >&2
            exit 1
          fi
          echo "Validated release APK: $RELEASE_APK ($(stat -c%s "$RELEASE_APK") bytes)"

      - name: Upload signed release APK
        if: steps.release.outcome == 'success' && steps.release.outputs.artifact_name == 'MinecraftBotHost-Release-APK'
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBotHost-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: steps.release.outcome == 'success' && steps.release.outputs.artifact_name == 'MinecraftBotHost-Release-APK-Unsigned'
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBotHost-Release-APK-Unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Gradle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftBotHost-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14
